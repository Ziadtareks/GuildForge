[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guildforge"
version = "1.0.0"
description = "Copy a Discord server's structure to your own server in one command."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ziad Tarek", email = "ziadtareks@users.noreply.github.com" }]
keywords = ["discord", "discord-py", "cli", "server", "clone", "backup"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "discord.py>=2.4,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "questionary>=2.0,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyinstaller>=6.6",
]
build = ["pyinstaller>=6.6"]

[project.scripts]
guildforge = "guildforge.cli:main"

[project.urls]
Homepage = "https://github.com/Ziadtareks/GuildForge"
Repository = "https://github.com/Ziadtareks/GuildForge"
Issues = "https://github.com/Ziadtareks/GuildForge/issues"
Changelog = "https://github.com/Ziadtareks/GuildForge/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["guildforge", "guildforge.models", "guildforge.discord_io", "guildforge.utils"]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
guildforge = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented API uses function calls in argument defaults.
"src/guildforge/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
