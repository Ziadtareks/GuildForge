name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build one-file executable
        run: >
          pyinstaller --onefile --clean --noconfirm
          --name GuildForge
          --paths src
          --collect-all discord
          packaging/entrypoint.py

      - name: Smoke test the executable
        run: |
          .\dist\GuildForge.exe --version
          .\dist\GuildForge.exe --help

      - name: Build source archive
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="GuildForge-${TAG}/" -o "GuildForge-${TAG}-source.zip" HEAD
          ls -lh "GuildForge-${TAG}-source.zip"

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/GuildForge.exe "GuildForge-${TAG}-source.zip" --clobber
          else
            gh release create "$TAG" \
              dist/GuildForge.exe \
              "GuildForge-${TAG}-source.zip" \
              --title "GuildForge ${TAG}" \
              --generate-notes
          fi
